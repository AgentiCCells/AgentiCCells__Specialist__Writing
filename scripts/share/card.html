<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>Share card</title>
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#fbf7f0;color:#222;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
.bar{width:28px;background:#c98a2b}
.main{flex:1;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{font-size:30px;color:#7a3e00;font-weight:600;letter-spacing:.02em}
h1{font-size:92px;line-height:1.02;margin:18px 0 0}
.lede{font-size:36px;line-height:1.35;color:#333;max-width:960px}
.rules{display:flex;gap:18px;flex-wrap:wrap}
.rules span{font-size:26px;background:#f1e2c6;color:#5a3a00;padding:10px 20px;border-radius:30px;font-weight:600}
.foot{font-size:26px;color:#666}
</style></head>
<body><div class="bar"></div><div class="main">
<div><div class="kicker">AgentiCCells specialist agent</div><h1>Writing</h1></div>
<div class="lede">Voice, structure and wording for every team: guidance, a day-one pack and reviews on request.</div>
<div class="rules"><span>Plain British English</span><span>Every number sourced</span><span>Say what runs</span><span>Agents draft, people send</span></div>
<div class="foot">specialist-writing.agenticcells.site</div>
</div></body></html>
